name: Contract runtimes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  native-and-soroban:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32v1-none
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/common -> target
            contracts/solana -> target
            contracts/stellar -> target
      - name: Check formatting and native conformance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contracts/dist
          for rail in common solana stellar sbf-tests; do
            cargo fmt --manifest-path "contracts/$rail/Cargo.toml" --check
          done
          cargo test --locked --manifest-path contracts/common/Cargo.toml 2>&1 | tee contracts/dist/common-tests.log
          cargo test --locked --manifest-path contracts/common/Cargo.toml --features stellar 2>&1 | tee contracts/dist/stellar-codec-tests.log
          cargo test --locked --manifest-path contracts/solana/Cargo.toml 2>&1 | tee contracts/dist/solana-native-tests.log
          ALLOWIT_SOLANA_NETWORK=testnet cargo test --locked --manifest-path contracts/solana/Cargo.toml --test testnet -- --nocapture 2>&1 | tee contracts/dist/solana-testnet-asset-test.log
      - name: Build Soroban Wasm
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz -o "$RUNNER_TEMP/binaryen.tar.gz"
          printf '%s  %s\n' 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 "$RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/binaryen-version_133/bin/wasm-opt" --version | tee contracts/dist/stellar-toolchain.log
          # LLVM's size profiles differ; measure both and validate the exact
          # smallest result in the real VM. Neither changes chain resource limits.
          # Normalize diagnostic paths so host checkout/cache names do not
          # consume the fixed Wasm upload budget.
          path_flags="--remap-path-prefix=$GITHUB_WORKSPACE=."
          cargo_cache_root="${CARGO_HOME:-$HOME/.cargo}"
          registry_sources=0
          for registry_path in "$cargo_cache_root"/registry/src/*; do
            if [ -d "$registry_path" ]; then
              path_flags+=" --remap-path-prefix=$registry_path=registry"
              registry_sources=$((registry_sources + 1))
            fi
          done
          # The preceding host tests fetch these sources. Refuse a reordered
          # workflow that would leave cache-specific index paths in the Wasm.
          test "$registry_sources" -gt 0
          path_flags+=" --remap-path-prefix=$cargo_cache_root/git/checkouts=git"
          smallest=999999999
          for rust_opt in z s; do
            RUSTFLAGS="${RUSTFLAGS:-} $path_flags" CARGO_PROFILE_RELEASE_OPT_LEVEL="$rust_opt" cargo build --locked --release --target wasm32v1-none --manifest-path contracts/stellar/Cargo.toml 2>&1 | tee -a contracts/dist/stellar-build.log
            for binaryen_opt in z 2 4; do
              candidate="$RUNNER_TEMP/allowit-stellar-$rust_opt-$binaryen_opt.wasm"
              opt_flags=("-O$binaryen_opt")
              if [ "$binaryen_opt" != z ]; then opt_flags+=(--shrink-level=2); fi
              "$RUNNER_TEMP/binaryen-version_133/bin/wasm-opt" --mvp-features "${opt_flags[@]}" --converge --strip-debug --strip-dwarf --strip-producers contracts/stellar/target/wasm32v1-none/release/allowit_stellar.wasm -o "$candidate"
              size=$(wc -c < "$candidate")
              echo "LLVM opt=$rust_opt Binaryen O$binaryen_opt shrink=2 bytes=$size" | tee -a contracts/dist/stellar-toolchain.log
              if [ "$size" -lt "$smallest" ]; then
                smallest="$size"
                cp "$candidate" contracts/dist/allowit_stellar.wasm
                echo "selected LLVM=$rust_opt Binaryen=$binaryen_opt" | tee -a contracts/dist/stellar-toolchain.log
              fi
            done
          done
          sha256sum contracts/dist/allowit_stellar.wasm | tee contracts/dist/stellar-sha256.txt
      - name: Execute native Soroban and compiled Wasm tests
        shell: bash
        run: |
          set -euo pipefail
          export ALLOWIT_STELLAR_WASM="$GITHUB_WORKSPACE/contracts/dist/allowit_stellar.wasm"
          cargo test --locked --manifest-path contracts/stellar/Cargo.toml -- --nocapture 2>&1 | tee contracts/dist/stellar-runtime-tests.log
      - run: python3 scripts/package-licenses.py contracts/dist
        id: licenses
        if: always()
      - uses: actions/upload-artifact@v4
        if: always() && steps.licenses.outcome == 'success'
        with:
          name: soroban-and-native-evidence
          path: contracts/dist/
          if-no-files-found: error
  solana-sbf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ALLOWIT_SOLANA_NETWORK: devnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/solana -> target
            contracts/sbf-tests -> target
      - name: Install checksum-pinned official Agave tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agave"
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/agave.tar.bz2"
          printf '%s  %s\n' c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8 "$RUNNER_TEMP/agave.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP/agave"
          echo "$RUNNER_TEMP/agave/solana-release/bin" >> "$GITHUB_PATH"
      - name: Compile the actual SBF program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contracts/dist
          solana --version | tee contracts/dist/solana-toolchain.txt
          cargo build-sbf --version | tee -a contracts/dist/solana-toolchain.txt
          cargo build-sbf --manifest-path contracts/solana/Cargo.toml --tools-version v1.57 --sbf-out-dir "$GITHUB_WORKSPACE/contracts/dist" -- --locked 2>&1 | tee contracts/dist/solana-sbf-build.log
          if grep -Eqi 'Stack offset|stack frame.*(exceed|too large)' contracts/dist/solana-sbf-build.log; then
            echo 'SBF compiler reported an unsafe stack frame.' >&2
            exit 1
          fi
          sha256sum contracts/dist/allowit_solana.so | tee contracts/dist/solana-sha256.txt
      - name: Execute compiled SBF and real SPL Token in Mollusk
        shell: bash
        run: |
          set -euo pipefail
          export SBF_OUT_DIR="$GITHUB_WORKSPACE/contracts/dist"
          cargo test --locked --manifest-path contracts/sbf-tests/Cargo.toml -- --nocapture 2>&1 | tee contracts/dist/solana-sbf-runtime-tests.log
      - run: python3 scripts/package-licenses.py contracts/dist
        id: licenses
        if: always()
      - uses: actions/upload-artifact@v4
        if: always() && steps.licenses.outcome == 'success'
        with:
          name: solana-sbf-evidence
          # build-sbf may generate a deployment keypair; it is never an artifact.
          path: |
            contracts/dist/*.so
            contracts/dist/*.log
            contracts/dist/*sha256.txt
            contracts/dist/solana-toolchain.txt
            contracts/dist/LICENSE
            contracts/dist/THIRD_PARTY_NOTICES.md
            contracts/dist/licenses/
          if-no-files-found: error
